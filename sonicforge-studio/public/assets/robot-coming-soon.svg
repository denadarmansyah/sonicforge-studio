<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" fill="none">
  <!-- Action Lines Left -->
  <g stroke="#0F0F10" stroke-width="3.5" stroke-linecap="round">
    <line x1="56" y1="60" x2="66" y2="75" />
    <line x1="38" y1="82" x2="54" y2="90" />
    <line x1="38" y1="108" x2="52" y2="108" />
  </g>
  <!-- Musical Note Top Right -->
  <g fill="#0F0F10">
    <ellipse cx="195" cy="49" rx="5.5" ry="4.2" transform="rotate(-20 195 49)" />
    <path d="M199 48L204 28C209 31 213 36 211 43" stroke="#0F0F10" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
  <!-- Antenna -->
  <line x1="136" y1="45" x2="138" y2="27" stroke="#0F0F10" stroke-width="4.5" stroke-linecap="round" />
  <circle cx="139" cy="21" r="7.5" fill="#3F3F46" stroke="#0F0F10" stroke-width="3" />
  <circle cx="136.5" cy="18.5" r="2" fill="#FAFAFA" />

  <!-- Robot Ears -->
  <ellipse cx="81" cy="96" rx="7" ry="15" fill="#A1A1AA" stroke="#0F0F10" stroke-width="3" />
  <ellipse cx="183" cy="98" rx="8" ry="16" fill="#A1A1AA" stroke="#0F0F10" stroke-width="3" />

  <!-- Robot Head -->
  <rect x="82" y="45" width="100" height="84" rx="42" fill="#FAFAFA" stroke="#0F0F10" stroke-width="3.5" />
  <!-- Subtle Shading inside Head -->
  <path d="M158 52C172 62 178 78 176 98C174 114 160 124 138 126C155 120 166 108 168 90C169 74 165 60 158 52Z" fill="#E4E4E7" />

  <!-- Robot Face Screen -->
  <rect x="93" y="62" width="74" height="52" rx="22" fill="#141416" />
  <!-- Robot Eyes -->
  <rect x="109" y="80" width="8" height="16" rx="4" fill="#FAFAFA" />
  <rect x="142" y="81" width="8" height="16" rx="4" fill="#FAFAFA" />
  <!-- Robot Smile -->
  <path d="M124 98Q130 103 136 98" stroke="#FAFAFA" stroke-width="2.6" stroke-linecap="round" fill="none" />

  <!-- Robot Neck & Shoulders -->
  <rect x="116" y="128" width="30" height="10" fill="#D4D4D8" stroke="#0F0F10" stroke-width="3" />
  <path d="M198 158C208 172 210 192 200 202" stroke="#0F0F10" stroke-width="14" stroke-linecap="round" />
  <path d="M198 158C208 172 210 192 200 202" stroke="#52525B" stroke-width="8" stroke-linecap="round" />

  <!-- COMING SOON Sign -->
  <g transform="rotate(3 132 172)">
    <rect x="56" y="135" width="146" height="76" rx="8" fill="#FAFAFA" stroke="#0F0F10" stroke-width="4" />
    <text x="129" y="169" text-anchor="middle" fill="#0F0F10" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="22" letter-spacing="-0.5">COMING</text>
    <text x="129" y="193" text-anchor="middle" fill="#0F0F10" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="22" letter-spacing="-0.5">SOON</text>
  </g>

  <!-- Robot Hands Gripping Sign -->
  <ellipse cx="52" cy="176" rx="8" ry="13" fill="#3F3F46" stroke="#0F0F10" stroke-width="3.2" />
  <ellipse cx="192" cy="204" rx="12" ry="9" transform="rotate(-25 192 204)" fill="#3F3F46" stroke="#0F0F10" stroke-width="3.2" />
</svg>
